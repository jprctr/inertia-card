<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inertia Card</title>
  <link rel="stylesheet" href="./inertia/inertia.css">
  <style>
    body {
      font-family: sans-serif;
      color: #27253d;
    }
    h1 {
      position: absolute;
    }
    .inertia {
      /* should adjust to any width and height within reason */
      height: 75vh;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <h1>Inertia Card</h1>
  <div id="inertiaContainer" class="inertia" />
  <script type="module">
    import SetupInertia from './inertia/inertia.js';
    const slides = new Array(7).fill(null).map((_, i) => ({
      title: `This is my title ${i + 1}`,
      description: `Lorem iosum dolor sit amet, consectetur adipiscing elit. Phasellus a enim.`,
      image: `/images/${i}.jpg`,
      link: `/my-link/${i}`,
    }));
    SetupInertia('inertiaContainer', slides);
  </script>
</body>

</html>
