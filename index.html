<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inertia Card</title>
  <style>
    body {
      font-family: sans-serif;
    }
    .card {
      width: 300px;
      height: 200px;
      border-radius: 1em;
      padding: 1em;
      cursor: pointer;
      background: rgba(0, 0, 100, 0.1);
    }
    .card:hover {
      background: rgba(0, 0, 255, 0.1);
    }
    .inertia {
      position: relative;
      height: 50vh;
      background: rgba(0, 0, 0, 0.1);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <h1>Inertia Card</h1>
  <div id="inertiaContainer" class="inertia" />
  <div id="cards" style="height: 0; overflow: hidden;">
    <div class="card">0</div>
    <div class="card" style="width: 500px">1</div>
    <div class="card" style="height: 100px">2</div>
    <div class="card" style="width: 200px">3</div>
    <div class="card">4</div>
  </div>
  <script type="module">
    import { SetupScene } from './inertia.js';
    SetupScene('inertiaContainer', 'cards');
  </script>
</body>

</html>
